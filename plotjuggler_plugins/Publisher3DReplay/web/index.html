<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Replay - PlotJuggler</title>
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #viewer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #000; color: #eee; font: 13px sans-serif; }
    #panel {
      position: absolute; top: 8px; left: 8px; padding: 6px 10px;
      background: rgba(42, 42, 42, 0.8); border-radius: 4px; line-height: 1.6;
    }
    #time { font: bold 15px monospace; }
    #status { color: #fc6; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <div id="panel">
    <div id="time">t = -</div>
    <div id="mode"></div>
    <div id="status">Connecting to PlotJuggler...</div>
    <label><input type="checkbox" id="follow" checked> Follow vehicle</label><br>
    <label><input type="checkbox" id="path" checked> Show flight path</label>
  </div>
  <script src="replay.js"></script>
</body>
</html>
